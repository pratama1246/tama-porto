<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <!-- Solid White Background for 1:1 Instagram Profile -->
  <rect width="1080" height="1080" fill="#ffffff" />

  <!-- Centered Official Polaroid Icon (Scaled to fit within Instagram circle crop) -->
  <g transform="translate(97.5, 106.35) scale(8.85)">
    <!-- Top washi tape (pastel pink) -->
    <g transform="rotate(-4, 50, 15)">
      <rect x="32" y="8" width="36" height="15" rx="3" fill="#ffb3c6" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round" />
    </g>
    <!-- Polaroid white frame with solid white background -->
    <rect x="14" y="16" width="72" height="76" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="6" stroke-linejoin="round" />
    <!-- Inner photo area (pastel yellow) -->
    <rect x="22" y="24" width="56" height="46" rx="6" fill="#ffeaa7" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round" />
    <!-- Cute smiley eyes -->
    <circle cx="39" cy="43" r="4.5" fill="#1a1a1a" />
    <circle cx="61" cy="43" r="4.5" fill="#1a1a1a" />
    <!-- Cute smile arc -->
    <path d="M 39 53 Q 50 64 61 53" fill="none" stroke="#1a1a1a" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
